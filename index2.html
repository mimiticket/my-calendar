<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Calendar Landscape</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* กล่องหลักทรงแนวนอน (Landscape Sheet) */
        .calendar-card {
            width: 100%;
            max-width: 1100px; /* ขยายแนวนอนกว้าง */
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        /* Header Layout ตามรูปเรฟ */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* กล่องสีชมพูใส่ปี/เลขเดือน */
        .month-box {
            background-color: #e0a3b0;
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 16px;
            text-align: center;
            min-width: 85px;
        }

        .year-text {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            line-height: 1;
        }

        .month-num {
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1.1;
        }

        /* ชื่อเดือนแบบตัวเขียน */
        .month-name {
            font-family: 'Playfair Display', serif;
            font-size: 3.8rem;
            font-weight: 600;
            color: #222222;
            line-height: 1;
        }

        .nav-controls {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: #f0f0f0;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: #444;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #e0a3b0;
            color: white;
        }

        /* ตารางปฏิทินแบบกว้าง */
        .calendar-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px; /* รักษารูปทรงแนวนอนไม่ให้โดนบีบ */
        }

        /* แถบหัววัน Sunday - Saturday สีชมพู */
        .day-header {
            background-color: #e0a3b0;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            padding: 8px 0;
            border: 1px solid #d493a1;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            width: 14.28%;
        }

        /* ช่องวันที่ */
        .day-cell {
            border: 1px solid #dcdcdc;
            height: 110px; /* เพิ่มความสูงของช่อง */
            vertical-align: top;
            padding: 6px 8px;
            background: #ffffff;
            position: relative;
        }

        .day-cell.other-month {
            background-color: #fcfcfc;
            color: #ccc;
        }

        .day-number {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 4px;
        }

        .day-cell.other-month .day-number {
            color: #ccc;
        }

        /* วันปัจจุบัน (วงกลมไฮไลต์) */
        .day-cell.today .day-number {
            display: inline-block;
            background-color: #e0a3b0;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            text-align: center;
            line-height: 22px;
            font-weight: 600;
        }

        /* พื้นที่สำหรับพิมพ์ข้อความในช่อง */
        .cell-input {
            width: 100%;
            height: calc(100% - 24px);
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            font-size: 0.85rem;
            color: #333;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div class="calendar-card">
    <!-- Header สไตล์เรฟ -->
    <div class="header-container">
        <div class="header-left">
            <div class="month-box">
                <div class="year-text" id="yearText">2026</div>
                <div class="month-num" id="monthNum">07</div>
            </div>
            <div class="month-name" id="monthName">July</div>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
            <button class="nav-btn" onclick="changeMonth(1)">❯</button>
        </div>
    </div>

    <!-- ตารางปฏิทินแนวนอน -->
    <div class="calendar-table-wrapper">
        <table class="calendar-table">
            <thead>
                <tr>
                    <th class="day-header">Sunday</th>
                    <th class="day-header">Monday</th>
                    <th class="day-header">Tuesday</th>
                    <th class="day-header">Wednesday</th>
                    <th class="day-header">Thursday</th>
                    <th class="day-header">Friday</th>
                    <th class="day-header">Saturday</th>
                </tr>
            </thead>
            <tbody id="calendarBody">
                <!-- Javascript จะสร้างช่องตารางใส่ตรงนี้ -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    let calendarData = JSON.parse(localStorage.getItem('landscape_calendar_data')) || {};

    function renderCalendar() {
        // อัปเดต Header
        document.getElementById('yearText').innerText = currentYear;
        document.getElementById('monthNum').innerText = String(currentMonth + 1).padStart(2, '0');
        document.getElementById('monthName').innerText = monthNames[currentMonth];

        const tbody = document.getElementById('calendarBody');
        tbody.innerHTML = '';

        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevLastDate = new Date(currentYear, currentMonth, 0).getDate();

        let date = 1;
        let nextDate = 1;

        // สร้างตาราง 5-6 แถว
        for (let row = 0; row < 6; row++) {
            let tr = document.createElement('tr');
            let hasDateInRow = false;

            for (let col = 0; col < 7; col++) {
                let td = document.createElement('td');
                td.className = 'day-cell';

                if (row === 0 && col < firstDayIndex) {
                    // วันของเดือนก่อนหน้า
                    let prevNum = prevLastDate - firstDayIndex + col + 1;
                    td.classList.add('other-month');
                    td.innerHTML = `<div class="day-number">${prevNum}</div>`;
                } else if (date > lastDate) {
                    // วันของเดือนถัดไป
                    td.classList.add('other-month');
                    td.innerHTML = `<div class="day-number">${nextDate}</div>`;
                    nextDate++;
                } else {
                    // วันในเดือนปัจจุบัน
                    hasDateInRow = true;
                    const isToday = date === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
                    if (isToday) td.classList.add('today');

                    const dateKey = `${currentYear}-${currentMonth + 1}-${date}`;
                    const savedText = calendarData[dateKey] || '';

                    td.innerHTML = `
                        <div class="day-number">${date}</div>
                        <textarea class="cell-input" oninput="saveData('${dateKey}', this.value)">${savedText}</textarea>
                    `;
                    date++;
                }
                tr.appendChild(td);
            }

            // ถ้าแถวสุดท้ายไม่มีวันที่ของเดือนปัจจุบันเลย ให้ข้าม
            if (row > 4 && !hasDateInRow && nextDate > 7) {
                break;
            }

            tbody.appendChild(tr);
        }
    }

    function saveData(dateKey, text) {
        calendarData[dateKey] = text;
        localStorage.setItem('landscape_calendar_data', JSON.stringify(calendarData));
    }

    function changeMonth(step) {
        currentMonth += step;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        } else if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    renderCalendar();
</script>

</body>
</html>
