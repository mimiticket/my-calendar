<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Calendar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f7f7;
            color: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .calendar-card {
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        /* Header สไตล์มินิมอลตามรูป reference */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .month-year-group {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .month-num {
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 0.9;
            color: #2b2b2b;
        }

        .slash {
            font-size: 2.2rem;
            font-weight: 200;
            color: #888;
        }

        .year-text-group {
            display: flex;
            flex-direction: column;
        }

        .year-num {
            font-size: 1.1rem;
            color: #666;
            letter-spacing: 1px;
        }

        .month-name {
            font-size: 1.2rem;
            color: #333;
            font-weight: 500;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: none;
            border: 1px solid #eee;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #666;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #f5f5f5;
        }

        /* ตารางปฏิทิน */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 8px;
            text-transform: lowercase;
        }

        .weekdays div:nth-child(6) { color: #82a8cd; } /* สด */
        .weekdays div:nth-child(7) { color: #d98888; } /* อา */

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid #eaeaea;
            border-left: 1px solid #eaeaea;
        }

        /* ช่องวันที่ทรงใหญ่ สไตล์เรียบง่าย */
        .day-cell {
            background: #fff;
            border-right: 1px solid #eaeaea;
            border-bottom: 1px solid #eaeaea;
            min-height: 140px; /* ขยายความสูงช่องให้ใหญ่ขึ้น */
            padding: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .day-num {
            font-size: 0.95rem;
            color: #555;
            font-weight: 400;
        }

        /* ไฮไลต์วันปัจจุบัน */
        .is-today .day-num {
            background: #d98888;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .other-month {
            background-color: #fafafa;
        }
        .other-month .day-num {
            opacity: 0.25;
        }

        /* พื้นที่เขียนพร้อมเส้น 4 บรรทัด และ Checkbox */
        .lines-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 2px;
            height: 100%;
        }

        .line-item {
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed #e5e5e5; /* เส้นขีด 4 บรรทัด */
            padding-bottom: 2px;
            height: 24px;
        }

        .line-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
            position: relative;
        }

        .line-item input[type="checkbox"]:checked {
            background-color: #72b08e;
            border-color: #72b08e;
        }

        .line-item input[type="checkbox"]:checked::after {
            content: '✓';
            color: white;
            font-size: 10px;
            position: absolute;
            top: -2px;
            left: 1px;
        }

        .line-item input[type="text"] {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.78rem;
            color: #444;
            outline: none;
        }

        .line-item input[type="text"]:focus {
            background: rgba(0,0,0,0.01);
        }

        @media (max-width: 600px) {
            .day-cell { min-height: 110px; padding: 4px; }
            .month-num { font-size: 2.5rem; }
            .line-item { gap: 3px; height: 20px; }
            .line-item input[type="text"] { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="calendar-card">
    <div class="calendar-header">
        <div class="month-year-group">
            <div class="month-num" id="monthNum">7</div>
            <div class="slash">/</div>
            <div class="year-text-group">
                <div class="year-num" id="yearNum">2026</div>
                <div class="month-name" id="monthName">July</div>
            </div>
        </div>
        <div class="nav-btns">
            <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
            <button class="nav-btn" onclick="changeMonth(1)">❯</button>
        </div>
    </div>

    <div class="weekdays">
        <div>mon</div><div>tue</div><div>wed</div><div>thu</div><div>fri</div><div>sat</div><div>sun</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>
</div>

<script>
    const monthsEng = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    // กำหนดวันที่ปัจจุบันเสมอ
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    // โหลดข้อมูลบันทึก
    let calendarData = JSON.parse(localStorage.getItem('minimal_cal_data')) || {};

    function renderCalendar() {
        document.getElementById('monthNum').innerText = currentMonth + 1;
        document.getElementById('yearNum').innerText = currentYear;
        document.getElementById('monthName').innerText = monthsEng[currentMonth];

        const daysGrid = document.getElementById('daysGrid');
        daysGrid.innerHTML = '';

        // หาจุดเริ่มต้นวันในสัปดาห์ (จันทร์ = 0, อาทิตย์ = 6)
        let firstDay = new Date(currentYear, currentMonth, 1).getDay();
        firstDay = (firstDay === 0) ? 6 : firstDay - 1; // ปรับให้เริ่มวันจันทร์

        const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevLastDate = new Date(currentYear, currentMonth, 0).getDate();

        // ช่องเดือนก่อนหน้า
        for (let x = firstDay; x > 0; x--) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-cell other-month';
            dayDiv.innerHTML = `<div class="day-num">${prevLastDate - x + 1}</div>`;
            daysGrid.appendChild(dayDiv);
        }

        // ช่องของเดือนปัจจุบัน
        for (let i = 1; i <= lastDate; i++) {
            const dayDiv = document.createElement('div');
            const isToday = i === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
            
            dayDiv.className = `day-cell ${isToday ? 'is-today' : ''}`;

            const dateKey = `${currentYear}-${currentMonth + 1}-${i}`;
            const dayData = calendarData[dateKey] || [
                { c: false, t: '' },
                { c: false, t: '' },
                { c: false, t: '' },
                { c: false, t: '' }
            ];

            let linesHTML = '';
            for (let line = 0; line < 4; line++) {
                const item = dayData[line] || { c: false, t: '' };
                linesHTML += `
                    <div class="line-item">
                        <input type="checkbox" ${item.c ? 'checked' : ''} 
                            onchange="saveData('${dateKey}', ${line}, 'c', this.checked)">
                        <input type="text" value="${item.t || ''}" 
                            oninput="saveData('${dateKey}', ${line}, 't', this.value)">
                    </div>
                `;
            }

            dayDiv.innerHTML = `
                <div class="day-header">
                    <span class="day-num">${i}</span>
                </div>
                <div class="lines-container">
                    ${linesHTML}
                </div>
            `;

            daysGrid.appendChild(dayDiv);
        }
    }

    function saveData(dateKey, lineIndex, field, value) {
        if (!calendarData[dateKey]) {
            calendarData[dateKey] = [
                { c: false, t: '' },
                { c: false, t: '' },
                { c: false, t: '' },
                { c: false, t: '' }
            ];
        }
        calendarData[dateKey][lineIndex][field] = value;
        localStorage.setItem('minimal_cal_data', JSON.stringify(calendarData));
    }

    function changeMonth(step) {
        currentMonth += step;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        } else if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    renderCalendar();
</script>

</body>
</html>
