<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar & Habit Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        .calendar-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #2c3e50;
        }

        .nav-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #357abd;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-card {
            background: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            min-height: 110px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            /* เส้นบรรทัดในช่อง */
            background-image: linear-gradient(#e1e8ed 1px, transparent 1px);
            background-size: 100% 24px;
            background-position: 0 28px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .day-number {
            font-weight: bold;
            font-size: 0.95rem;
            color: #333;
        }

        /* ปุ่มสีบอกวันปัจจุบัน */
        .today-badge {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(255,126,95,0.3);
        }

        /* ติ้กถูกสีเขียว */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #2ecc71; /* สีเขียว */
            cursor: pointer;
        }

        .day-note {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 0.85rem;
            line-height: 24px;
            color: #2c3e50;
            outline: none;
        }

        .other-month {
            opacity: 0.3;
            background-image: none;
        }

        @media (max-width: 600px) {
            .day-card {
                min-height: 90px;
                padding: 4px;
            }
            .day-note {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="header">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <h1 id="monthYearDisplay"></h1>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="weekdays">
        <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>
</div>

<script>
    const thaiMonths = [
        "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
        "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลากิจ", "พฤศจิกายน", "ธันวาคม"
    ];

    // ล็อกไว้ที่วันที่และเดือนปัจจุบันเสมอ
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    // โหลดข้อมูลที่เคยบันทึกไว้
    let calendarData = JSON.parse(localStorage.getItem('my_calendar_data')) || {};

    function renderCalendar() {
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const daysGrid = document.getElementById('daysGrid');
        daysGrid.innerHTML = '';

        monthYearDisplay.innerText = `${thaiMonths[currentMonth]} ${currentYear + 543}`;

        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevLastDate = new Date(currentYear, currentMonth, 0).getDate();

        // ช่องของเดือนก่อนหน้า
        for (let x = firstDayIndex; x > 0; x--) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-card other-month';
            dayDiv.innerHTML = `<span class="day-number">${prevLastDate - x + 1}</span>`;
            daysGrid.appendChild(dayDiv);
        }

        // ช่องของเดือนปัจจุบัน
        for (let i = 1; i <= lastDate; i++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-card';

            const isToday = i === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
            const dateKey = `${currentYear}-${currentMonth + 1}-${i}`;
            const savedData = calendarData[dateKey] || { checked: false, text: '' };

            dayDiv.innerHTML = `
                <div class="day-header">
                    <span class="day-number">${i}</span>
                    ${isToday ? '<span class="today-badge">วันนี้</span>' : ''}
                    <label class="checkbox-wrapper">
                        <input type="checkbox" class="custom-checkbox" 
                            ${savedData.checked ? 'checked' : ''} 
                            onchange="saveData('${dateKey}', 'checked', this.checked)">
                    </label>
                </div>
                <textarea class="day-note" 
                    placeholder="..." 
                    oninput="saveData('${dateKey}', 'text', this.value)">${savedData.text}</textarea>
            `;

            daysGrid.appendChild(dayDiv);
        }
    }

    function saveData(key, field, value) {
        if (!calendarData[key]) {
            calendarData[key] = { checked: false, text: '' };
        }
        calendarData[key][field] = value;
        localStorage.setItem('my_calendar_data', JSON.stringify(calendarData));
    }

    function changeMonth(step) {
        currentMonth += step;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        } else if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    // เริ่มต้นทำงาน
    renderCalendar();
</script>

</body>
</html>
